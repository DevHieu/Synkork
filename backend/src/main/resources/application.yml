spring:
  application:
    name: synkork

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/synkork?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

    encoding:
      charset: UTF-8
      enabled: true
      force: true

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}

  logging:
    pattern:
      correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

  management:
    endpoints:
      web:
        exposure:
          include: "*"
    zipkin:
      tracing:
        endpoint: "http://tempo:9411/api/v2/spans"
    endpoint:
      health:
        show:
          details: "always"
    metrics:
      distribution:
        percentiles-histogram:
          http:
            server:
              requests: true
    tracing:
      sampling:
        probability: 1.0

momo:
  partner-code: MOMO
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  endpoint: https://test-payment.momo.vn/v2/gateway/api/create
  redirect-url: ${FRONTEND_URL}/me/subscriptions
  ipn-url: ${SERVER_URL}/api/payment/momo/callback

